version: '3.8'

volumes:
  haibot-data:
    name: haibot-data
  haibot-secrets:
    name: haibot-secrets

services:
  haibot:
    image: agentscope/haibot:latest
    container_name: haibot
    restart: always
    ports:
      - "127.0.0.1:8088:8088"
    # environment:
    #   - HAIBOT_AUTH_ENABLED=true
    #   - HAIBOT_AUTH_USERNAME=admin
    #   - HAIBOT_AUTH_PASSWORD=yourpassword
    volumes:
      - haibot-data:/app/working
      - haibot-secrets:/app/working.secret
